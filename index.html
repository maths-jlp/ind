<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>jlp Maths — plan du réseau</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@500;600;700;800;900&display=swap">
<style>
/* Plan du réseau : un fond de plan clair, trois lignes de classe qui se croisent à la station « Châtelet (Émilie du) ». */
:root{
  --fond:#F7F6F2; --encre:#0E2A47; --gris:#DDDCD6; --gris-texte:#A3A29B; --seine:#CFE4F2;
  --l4:#BB4D98; --l1:#FFCD00; --lt:#E2231A; --vert:#16906F;
  --f:"Overpass","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fond);color:var(--encre);font-family:var(--f)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--encre);outline-offset:3px;border-radius:8px}

.plan{position:relative;height:100%;min-height:560px;overflow:hidden}
.plan svg.carte{position:absolute;inset:0;width:100%;height:100%}

/* Lignes cliquables */
.ligne-clic{cursor:pointer}
.ligne-clic .trace{transition:stroke-width .15s}
.ligne-clic:hover .trace,.ligne-clic:focus .trace{stroke-width:22}
.ligne-clic:focus{outline:none}

/* Cartouche titre */
.cartouche{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:max(20px,env(safe-area-inset-left,0px));background:var(--encre);color:#fff;border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 20px rgba(14,42,71,.18)}
.cartouche .m{width:46px;height:46px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;font-weight:900;font-size:22px}
.cartouche b{display:block;font-size:24px;font-weight:800;line-height:1}
.cartouche span{font-size:13px;font-weight:600;opacity:.75}

/* Légende = navigation principale */
.legende{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#fff;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 24px rgba(14,42,71,.14);min-width:300px}
.legende h2{margin:0 4px 2px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#5A6B7E}
.choix{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px}
.choix:hover{background:#F1F3F6}
.pastille{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}
.choix b{display:block;font-size:17px;font-weight:800}
.choix small{display:block;font-size:13px;color:#5A6B7E;font-weight:600}

.actions{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap}
.bouton{display:flex;align-items:center;gap:10px;padding:13px 20px;border-radius:12px;font-weight:800;font-size:18px;box-shadow:0 6px 20px rgba(14,42,71,.12)}
.bouton.qcm{background:var(--vert);color:#fff}
.bouton.entr{background:#fff;color:var(--encre);border:2px solid var(--vert)}
.prof{position:absolute;right:max(20px,env(safe-area-inset-right,0px));top:calc(26px + env(safe-area-inset-top,0px));font-size:13px;font-weight:700;color:#5A6B7E;background:rgba(255,255,255,.85);padding:7px 12px;border-radius:8px}
.prof:hover{color:var(--encre)}

/* Téléphone : le plan en haut, la légende en dessous */
@media (max-width:760px){
  html,body{height:auto}
  .plan{height:auto;min-height:0;display:flex;flex-direction:column;gap:14px;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
  .plan svg.carte{position:relative;height:auto;aspect-ratio:16/10;order:1}
  .cartouche,.legende,.actions,.prof{position:static;box-shadow:none}
  .cartouche{order:0}
  .legende{order:2;min-width:0}
  .actions{order:3}
  .prof{order:4;align-self:flex-start}
}
</style>
</head>
<body>
<main class="plan">
  <svg class="carte" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Plan du réseau : lignes 4, 1 et T">
    <!-- Seine -->
    <path d="M-20 655 C 240 600 420 720 700 672 S 1180 585 1620 650" fill="none" stroke="var(--seine)" stroke-width="64" stroke-linecap="round"/>
    <!-- Réseau d'arrière-plan -->
    <g fill="none" stroke="var(--gris)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <path d="M40 260 H330 L470 120 H760"/>
      <path d="M980 40 V220 L1180 420 H1580"/>
      <path d="M1260 880 V700 L1420 540 V300"/>
      <path d="M360 880 L520 720 H700 L760 660"/>
      <path d="M1010 880 L1120 770 H1300"/>
      <path d="M40 590 H220 L330 480 V300"/>
    </g>
    <g fill="#fff" stroke="var(--gris)" stroke-width="4">
      <circle cx="330" cy="260" r="7"/><circle cx="620" cy="120" r="7"/><circle cx="980" cy="56" r="7"/>
      <circle cx="1300" cy="420" r="7"/><circle cx="1420" cy="380" r="7"/><circle cx="600" cy="720" r="7"/>
      <circle cx="1200" cy="770" r="7"/><circle cx="220" cy="590" r="7"/><circle cx="1260" cy="760" r="7"/>
    </g>
    <g fill="var(--gris-texte)" font-family="Overpass, sans-serif" font-size="19" font-weight="700">
      <text x="300" y="242">Thalès</text><text x="590" y="102">Euclide</text><text x="996" y="62">Fermat</text>
      <text x="1270" y="404">Descartes</text><text x="1436" y="386">Gauss</text><text x="500" y="705">Hypatie</text>
      <text x="1180" y="802">Euler</text><text x="170" y="620">Pascal</text><text x="1276" y="766">Noether</text>
    </g>

    <!-- Ligne 1 · 1ère spé -->
    <a class="ligne-clic" href="ligne.html?classe=1ere" aria-label="Ligne 1 : 1ère spécialité">
      <path class="trace" d="M110 450 H1490" fill="none" stroke="var(--l1)" stroke-width="16" stroke-linecap="round"/>
      <path d="M110 450 H1490" fill="none" stroke="transparent" stroke-width="44"/>
      <g fill="#fff" stroke="var(--encre)" stroke-width="4"><circle cx="330" cy="450" r="9"/><circle cx="560" cy="450" r="9"/><circle cx="1060" cy="450" r="9"/><circle cx="1290" cy="450" r="9"/></g>
      <circle cx="80" cy="450" r="30" fill="var(--l1)"/><text x="80" y="460" text-anchor="middle" font-family="Overpass, sans-serif" font-size="30" font-weight="900" fill="var(--encre)">1</text>
      <circle cx="1520" cy="450" r="30" fill="var(--l1)"/><text x="1520" y="460" text-anchor="middle" font-family="Overpass, sans-serif" font-size="30" font-weight="900" fill="var(--encre)">1</text>
    </a>
    <!-- Ligne 4 · 4ème -->
    <a class="ligne-clic" href="ligne.html?classe=4eme" aria-label="Ligne 4 : 4ème">
      <path class="trace" d="M180 140 H500 L760 400 V500 L1020 760 H1160" fill="none" stroke="var(--l4)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M180 140 H500 L760 400 V500 L1020 760 H1160" fill="none" stroke="transparent" stroke-width="44" stroke-linejoin="round"/>
      <g fill="#fff" stroke="var(--encre)" stroke-width="4"><circle cx="360" cy="140" r="9"/><circle cx="630" cy="270" r="9"/><circle cx="890" cy="630" r="9"/><circle cx="1100" cy="760" r="9"/></g>
      <circle cx="150" cy="140" r="30" fill="var(--l4)"/><text x="150" y="150" text-anchor="middle" font-family="Overpass, sans-serif" font-size="30" font-weight="900" fill="#fff">4</text>
      <circle cx="1190" cy="760" r="30" fill="var(--l4)"/><text x="1190" y="770" text-anchor="middle" font-family="Overpass, sans-serif" font-size="30" font-weight="900" fill="#fff">4</text>
    </a>
    <!-- Ligne T · Terminale spé -->
    <a class="ligne-clic" href="ligne.html?classe=terminale" aria-label="Ligne T : Terminale spécialité">
      <path class="trace" d="M200 800 H560 L820 540 V360 L1080 100 H1400" fill="none" stroke="var(--lt)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M200 800 H560 L820 540 V360 L1080 100 H1400" fill="none" stroke="transparent" stroke-width="44" stroke-linejoin="round"/>
      <g fill="#fff" stroke="var(--encre)" stroke-width="4"><circle cx="400" cy="800" r="9"/><circle cx="690" cy="670" r="9"/><circle cx="950" cy="230" r="9"/><circle cx="1250" cy="100" r="9"/></g>
      <circle cx="170" cy="800" r="30" fill="var(--lt)"/><text x="170" y="810" text-anchor="middle" font-family="Overpass, sans-serif" font-size="30" font-weight="900" fill="#fff">T</text>
      <circle cx="1430" cy="100" r="30" fill="var(--lt)"/><text x="1430" y="110" text-anchor="middle" font-family="Overpass, sans-serif" font-size="30" font-weight="900" fill="#fff">T</text>
    </a>

    <!-- Station de correspondance -->
    <rect x="732" y="418" width="116" height="64" rx="32" fill="#fff" stroke="var(--encre)" stroke-width="6"/>
    <text x="860" y="503" font-family="Overpass, sans-serif" font-size="25" font-weight="800" fill="var(--encre)" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke"><title>Émilie du Châtelet (1706-1749), mathématicienne et physicienne, traductrice de Newton</title>Châtelet<tspan font-size="19" font-weight="600" font-style="italic" dx="6">(Émilie du)</tspan></text>
  </svg>

  <div class="cartouche">
    <span class="m" aria-hidden="true">M</span>
    <div><b>jlp Maths</b><span>Plan du réseau · choisis ta ligne</span></div>
  </div>

  <a class="prof" href="prof.html">Espace prof</a>

  <nav class="legende" aria-label="Choisir sa ligne">
    <h2>Ma ligne</h2>
    <a class="choix" href="ligne.html?classe=4eme"><span class="pastille" style="background:var(--l4);color:#fff">4</span><span><b>4ème</b><small data-encours="4eme">Ligne 4</small></span></a>
    <a class="choix" href="ligne.html?classe=1ere"><span class="pastille" style="background:var(--l1);color:var(--encre)">1</span><span><b>1ère spé</b><small data-encours="1ere">Ligne 1</small></span></a>
    <a class="choix" href="ligne.html?classe=terminale"><span class="pastille" style="background:var(--lt);color:#fff">T</span><span><b>Terminale spé</b><small data-encours="terminale">Ligne T</small></span></a>
  </nav>

  <div class="actions">
    <a class="bouton qcm" href="eval.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>QCM</a>
    <a class="bouton entr" href="entrainement.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>Entraînement</a>
  </div>
</main>

<script>
// Affiche le chapitre en cours de chaque ligne sous son nom (facultatif : la page marche sans).
const API = "https://shrill-wave-d596.j2la2se2re.workers.dev";
document.querySelectorAll("[data-encours]").forEach(el => {
  fetch(API + "/api/frise/" + el.dataset.encours).then(r => r.json()).then(d => {
    // Même règle que la ligne de la classe : dans l'ordre de l'année, le dernier chapitre ni terminé ni fermé.
    const cle = x => x.ordre ?? x.cree ?? 0;
    const liste = (d.chapitres || []).slice().sort((a, b) => cle(a) - cle(b));
    const ch = liste.filter(c => !c.termine && !c.ferme).pop();
    if (ch) el.textContent = "En ce moment : " + ch.titre;
  }).catch(() => {});
});
</script>
</body>
</html>
