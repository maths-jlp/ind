<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ma ligne</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@500;600;700;800;900&display=swap">
<style>
/* Page de classe : une seule grande ligne, chaque arrêt est un chapitre de l'année. */
:root{
  --fond:#F7F6F2; --encre:#0E2A47; --muted:#5A6B7E; --gris:#C9CDD3; --vert:#16906F;
  --c:#BB4D98; --c-txt:#fff; --c-doux:rgba(187,77,152,.18);
  --f:"Overpass","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--encre);font-family:var(--f)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--encre);outline-offset:3px;border-radius:8px}

header{background:var(--encre);color:#fff;border-bottom:6px solid var(--vert);padding:18px max(20px,env(safe-area-inset-right,0px)) 18px max(20px,env(safe-area-inset-left,0px));padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.retour{font-weight:700;font-size:14px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.12)}
.retour:hover{background:rgba(255,255,255,.22)}
.pastille{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:30px;background:var(--c);color:var(--c-txt);flex:none}
h1{margin:0;font-size:30px;font-weight:800;line-height:1.05}
.sous{font-size:14px;font-weight:600;opacity:.75;margin-top:4px}

main{padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px}
/* Plan en Z : la ligne va de gauche à droite, puis repart en diagonale au début de la rangée suivante. */
.plan{position:relative;width:100%}
.plan svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.plan .arret{position:absolute;transform:translateX(-50%);padding:0}
.plan .rail{width:auto;height:42px}
.plan .rail::before,.plan .rail::after{display:none}
.ligne-box{overflow-x:auto;padding:30px 10px 10px}
.ligne{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);min-width:min-content}
.arret{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 6px;position:relative;text-align:center}
.rail{position:relative;width:100%;height:40px;display:flex;justify-content:center;align-items:center}
.rail::before,.rail::after{content:"";position:absolute;top:50%;height:14px;margin-top:-7px;background:var(--c)}
.rail::before{left:-6px;right:50%}.rail::after{left:50%;right:-6px}
.arret:first-child .rail::before{left:50%;border-radius:7px 0 0 7px;display:none}
.arret:last-child .rail::after{display:none}
.point{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:#fff;border:6px solid var(--encre)}
.fait .point{background:var(--encre)}
.ici .point{width:42px;height:42px;border:8px solid var(--encre);box-shadow:0 0 0 8px var(--c-doux)}
.badge{position:absolute;top:-26px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--encre);white-space:nowrap}
.nom{font-size:18px;font-weight:800;line-height:1.15;text-wrap:balance}
.arret:hover .nom{text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:3px;text-underline-offset:4px}
.etat{font-size:13px;font-weight:600;color:var(--muted)}
.verrou{cursor:not-allowed}
.verrou .point{border-color:#B8BEC7;color:#8A93A0;display:grid;place-items:center}
.verrou .nom{color:#8A93A0}
.ligne-box .verrou .rail::before,.ligne-box .verrou .rail::after{opacity:.35}
.arret.verrou:hover .nom{text-decoration:none}
.vide{background:#fff;border-radius:14px;padding:28px;text-align:center;color:var(--muted);font-weight:600}

.bas{display:flex;gap:10px;flex-wrap:wrap}
.bouton{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;font-weight:800;font-size:16px}
.bouton.qcm{background:var(--vert);color:#fff}
.bouton.entr{background:#fff;color:var(--encre);border:2px solid var(--vert)}
.legende{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600;align-items:center}
.legende span{display:inline-flex;gap:6px;align-items:center}
.mini{width:14px;height:14px;border-radius:50%;border:3px solid var(--encre);background:#fff;display:inline-block}
</style>
</head>
<body>
<header>
  <a class="retour" href="index.html">◂ Plan du réseau</a>
  <span class="pastille" id="pastille">4</span>
  <div><h1 id="titre">Ligne</h1><div class="sous">Les chapitres de l'année · clique sur un arrêt</div></div>
</header>
<main>
  <div id="zone"><div class="vide">Chargement de la ligne…</div></div>
  <div class="legende">
    <span><span class="mini" style="background:var(--encre)"></span>Chapitre terminé</span>
    <span><span class="mini" style="box-shadow:0 0 0 4px var(--c-doux)"></span>Chapitre en cours</span>
    <span><span class="mini"></span>Autre chapitre</span>
    <span><span class="mini" style="border-color:#B8BEC7"></span>Pas encore ouvert</span>
  </div>
  <div class="bas">
    <a class="bouton qcm" href="eval.html">QCM</a>
    <a class="bouton entr" href="entrainement.html">Entraînement</a>
  </div>
</main>
<script>
const API = "https://shrill-wave-d596.j2la2se2re.workers.dev";
const LIGNES = {
  "4eme":      {num:"4", nom:"4ème",          c:"#BB4D98", txt:"#fff",    doux:"rgba(187,77,152,.2)"},
  "1ere":      {num:"1", nom:"1ère spé",      c:"#FFCD00", txt:"#0E2A47", doux:"rgba(255,205,0,.35)"},
  "terminale": {num:"T", nom:"Terminale spé", c:"#E2231A", txt:"#fff",    doux:"rgba(226,35,26,.2)"}
};
const CADENAS = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const classe = LIGNES[new URLSearchParams(location.search).get("classe")] ? new URLSearchParams(location.search).get("classe") : "4eme";
const L = LIGNES[classe];
const root = document.documentElement.style;
root.setProperty("--c", L.c); root.setProperty("--c-txt", L.txt); root.setProperty("--c-doux", L.doux);
document.getElementById("pastille").textContent = L.num;
document.getElementById("titre").textContent = "Ligne " + L.num + " · " + L.nom;
document.title = "Ligne " + L.num + " · " + L.nom;

fetch(API + "/api/frise/" + classe).then(r => r.json()).then(d => {
  const cle = x => x.ordre ?? x.cree ?? 0;
  const ch = (d.chapitres || []).slice().sort((a, b) => cle(a) - cle(b));
  const zone = document.getElementById("zone");
  if (!ch.length){ zone.innerHTML = '<div class="vide">La ligne est encore en travaux : aucun chapitre pour l\'instant.</div>'; return; }
  // « On est ici » : le chapitre le plus récent ni terminé ni fermé.
  let ici = -1;
  for (let i = ch.length - 1; i >= 0; i--) if (!ch[i].termine && !ch[i].ferme){ ici = i; break; }
  const html = ch.map((c, i) => {
    const verrou = !!c.ferme;
    const etat = verrou ? "verrou" : i === ici ? "ici" : c.termine ? "fait" : "";
    const n = c.notions ? c.notions.length : 0;
    const notionEnCours = c.notions && c.notions[Math.min(c.courant, n - 1)];
    const info = i === ici && !c.termine ? (notionEnCours ? "En ce moment : " + notionEnCours.titre : "En cours") : c.termine ? "Terminé" : n + " notion" + (n > 1 ? "s" : "");
    if (verrou) return `<div class="arret verrou" data-i="${i}" aria-disabled="true" title="Ce chapitre n'est pas encore ouvert">
      <span class="rail"><span class="point">${CADENAS}</span></span>
      <span class="nom">${esc(c.titre)}</span>
      <span class="etat">Bientôt</span>
    </div>`;
    return `<a class="arret ${etat}" data-i="${i}" href="frise.html?classe=${classe}&chap=${encodeURIComponent(c.id)}">
      <span class="rail">${etat === "ici" ? '<span class="badge">On est ici</span>' : ""}<span class="point"></span></span>
      <span class="nom">${esc(c.titre)}</span>
      <span class="etat">${esc(info)}</span>
    </a>`;
  }).join("");
  zone.innerHTML = '<div class="plan" id="plan"><svg id="trace" aria-hidden="true"></svg>' + html + '</div>';
  const placer = () => {
    const plan = document.getElementById("plan"); if (!plan) return;
    const W = plan.clientWidth;
    const parRang = Math.max(2, Math.min(6, Math.floor(W / 190), ch.length));
    // couloirs de 34 px à gauche et à droite pour les virages : le tracé ne passe jamais sur un nom
    const couloir = 34, pas = (W - 2 * couloir) / parRang;
    const arrets = [...plan.querySelectorAll(".arret")];
    arrets.forEach(a => { a.style.width = (pas - 16) + "px"; });
    const hEtiq = Math.max(...arrets.map(a => a.offsetHeight));
    const hRang = hEtiq + 76;
    const pts = ch.map((_, i) => {
      const r = Math.floor(i / parRang), k = i % parRang;
      return [couloir + pas / 2 + k * pas, 36 + r * hRang];
    });
    arrets.forEach(a => { const [x, y] = pts[+a.dataset.i]; a.style.left = x + "px"; a.style.top = (y - 21) + "px"; });
    const rangs = Math.ceil(ch.length / parRang);
    plan.style.height = (36 + (rangs - 1) * hRang + hEtiq - 21) + "px";
    // tracé : chaque segment est plus pâle s'il mène à un chapitre fermé
    const xd = W - couloir / 2, xg = couloir / 2;
    let svg = "";
    for (let i = 0; i + 1 < pts.length; i++){
      const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const pale = ch[i + 1].ferme ? ' opacity=".35"' : "";
      // Z : on descend dans le couloir de droite sous les noms, diagonale dans l'espace libre entre deux rangées,
      // puis on remonte par le couloir de gauche vers le premier arrêt de la rangée suivante
      const yA = y1 + hEtiq - 7, yB = y2 - 55;
      const d = y1 === y2 ? `M${x1} ${y1} L${x2} ${y2}`
        : `M${x1} ${y1} L${xd - 12} ${y1} L${xd} ${y1 + 12} L${xd} ${yA} L${xg} ${yB} L${xg} ${y2 - 12} L${xg + 12} ${y2} L${x2} ${y2}`;
      svg += `<path d="${d}" fill="none" stroke="${L.c}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"${pale}/>`;
    }
    const t = document.getElementById("trace");
    t.setAttribute("width", W); t.setAttribute("height", plan.style.height);
    t.innerHTML = svg;
  };
  placer();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placer);
  let att; window.addEventListener("resize", () => { clearTimeout(att); att = setTimeout(placer, 120); });
}).catch(() => { document.getElementById("zone").innerHTML = '<div class="vide">Trafic interrompu : la ligne n\'a pas pu être chargée.</div>'; });
</script>
</body>
</html>
